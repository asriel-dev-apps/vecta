packages:
  - apps/*
  - packages/*

allowBuilds:
  core-js-pure: false
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false
  workerd: true

peerDependencyRules:
  # partyserver's Workers types peer is compile-time only; Wrangler-generated
  # bindings are the source of truth for this Worker.
  ignoreMissing:
    - '@cloudflare/workers-types'

overrides:
  # drizzle-kit still reaches an obsolete esbuild through its deprecated loader.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # GHSA (high): postcss <=8.5.17 auto-loads the file named by a `sourceMappingURL`
  # comment, so a CSS file can make it read an arbitrary `.map`. It reaches us only
  # transitively (`agents` → `vite` → postcss), so there is nothing of ours to bump —
  # hence an override rather than a version change.
  #
  # An override, NOT an entry in an "assessed, not reachable" allowlist: the
  # exposure requires processing CSS somebody else wrote, which is not true today,
  # and an allowlist entry would encode that as a standing fact. Whether we process
  # foreign CSS is a decision a future change could quietly reverse, and nothing
  # would re-open the file. Raising the floor needs no one to remember anything.
  #
  # This is a FLOOR, not a pin, and the maturity policy below decides the ceiling:
  # a re-resolution takes the newest version that satisfies this range AND has been
  # public for seven days. Do not "catch it up" past that.
  #
  # Raised to >=8.5.29 on 2026-10-21. GHSA-2v37-7h3g-55p8 (nanoid <3.3.18) and
  # GHSA-68fv-2mgg-jv7q (source-map-js <1.2.2) arrive only through postcss, and
  # 8.5.29 is the first release that requires both fixes (nanoid ^3.3.19,
  # source-map-js ^1.2.2). vite@8.1.6 still asks for postcss ^8.5.17. Remove this
  # raised floor when vite depends on postcss >=8.5.29.
  postcss: '>=8.5.29'

  # GHSA-mwp4-54f8-5fhr (high): `ip-address` <=10.3.0 decodes leading-zero octets
  # as decimal while resolvers decode them as octal, so a check that resolves an
  # address and a resolver that dials it can disagree — SSRF and trust-boundary
  # bypass. It arrives only as `@modelcontextprotocol/sdk` -> `express-rate-limit`
  # -> `ip-address`, so there is nothing of ours to bump; measured 2026-08-04,
  # taking the SDK from 1.29.0 to 1.30.0 does NOT move it (and duplicates the SDK,
  # because `agents` -> `@cloudflare/codemode` holds 1.29.0). A floor, like postcss
  # above, so a re-resolution takes the newest version that satisfies it and has
  # been public for seven days.
  ip-address: '>=10.3.1'

  # GHSA-qw65-cvwx-89v3 (high, patched >=3.1.7; also GHSA-7p8r-x3mc-p8w7 and the 3.1.6 host-confusion advisories): fast-uri via sdk -> ajv. Stay on 3.x — ajv@8 asks for ^3, and a bare >=3.1.7 resolves into 4.x, which ajv never sanctioned. Remove when ajv depends on fast-uri >=3.1.7.
  fast-uri: '>=3.1.7 <4'

  # GHSA-22jm-h49p-29qw, GHSA-46jr-4wx8-v453, GHSA-6qxp-vccf-f47h (high, patched >=1.32.0): agents@0.19.0 depends on exactly @modelcontextprotocol/sdk@1.29.0, and no agents release depends on >=1.32.0 (0.28.1 only peers 1.32.1 next to the SDK v2 client/server packages). Remove when agents requests a patched SDK.
  '@modelcontextprotocol/sdk': 1.32.1

  # GHSA-jqcg-44mw-7w3h (critical, proxy-addr <2.0.8): express@5.3.0 is the release that depends on proxy-addr ^2.0.8, but @modelcontextprotocol/sdk@1.32.1 only asks for express ^5.2.1, so the lockfile stayed on 5.2.1 / proxy-addr 2.0.7. Remove when the SDK depends on express >=5.3.0.
  express: '>=5.3.0 <6'

  # GHSA-c83g-rgw3-j3cx and GHSA-73wf-gq98-2v4g (high, browserslist <=4.28.6): arrives via agents -> @babel/helper-compilation-targets, whose newest release still asks for browserslist ^4.24.0. Remove when that helper depends on browserslist >=4.28.7.
  browserslist: '>=4.28.7'

# Dependency maturity. A package published minutes ago is the shape a compromised
# release takes — the window between an attacker publishing and the registry
# pulling it is measured in hours — so nothing enters this tree until it has been
# public for seven days. 10080 minutes; the unit is MINUTES, and pnpm's built-in
# default is 1440 (one day), so before this line the posture was a default nobody
# chose rather than an absence of protection.
minimumReleaseAge: 10080

# The second lock, and the one that is easy to leave off. Measured with pnpm
# 11.12.0 on 2026-07-29, in an isolated workspace, both directions:
#
#   * with `minimumReleaseAge` set, an under-age dependency fails the install
#     (ERR_PNPM_NO_MATURE_MATCHING_VERSION, exit 1) and nothing is written;
#   * with it ABSENT, pnpm enforces its 1440-minute default by APPENDING the
#     offending versions to `minimumReleaseAgeExclude` and exiting 0. That is how
#     an 18-hour-old @tanstack/react-virtual exempted itself here on 2026-07-29.
#
# `minimumReleaseAgeStrict: true` turns that append back into a hard failure even
# if the value above is ever deleted. So the policy can be weakened, but it cannot
# go quiet — which is the property worth having.
minimumReleaseAgeStrict: true

# `minimumReleaseAgeExclude` is deliberately ABSENT, not empty. Its six previous
# entries were all self-appended by pnpm under the default, and every one of them
# was inert by the time this policy landed: each locked version is now older than
# seven days (measured against the registry's publish times), so removing them
# changed no resolution at all — `pnpm install --frozen-lockfile` exits 0 without
# them. Two of the six did not even match the lockfile any more
# (@hono/zod-openapi@1.5.0 vs the locked 1.5.1, @cloudflare/workers-types
# 5.20260716.1 vs 5.20260714.1), which is what a list nobody wrote looks like.
#
# If an entry ever becomes genuinely necessary, `.github/scripts/verify-release-age-policy.mjs`
# requires it to name an exact version and to carry a comment saying why. Note the
# entries are version-specific in practice despite the docs' wording: measured,
# @cloudflare/codemode@0.4.3 sat in this list while 0.4.4 was still refused. An
# entry added to get past a red install is the policy being defeated, not applied.
