name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same BRANCH, so that a rapid push sequence does
# not queue a backlog of checks and — the reason this is keyed on the branch name
# rather than on github.ref — so that the push run and the pull_request run of the
# same commit collapse into one.
#
# While a PR is open, every push fires both events. Their refs differ
# (refs/heads/<branch> vs refs/pull/<n>/merge), so a github.ref key put them in
# different groups and both survived: measured on 2026-07-26, every SHA pushed
# with the PR open had exactly two identical `check` runs. head_ref (set only on
# pull_request, to the source branch) and ref_name (the plain branch name on push)
# both yield `<branch>`, so the two now contend for one slot and one is cancelled.
#
# Trade-off, accepted deliberately: which of the two survives is a race. The
# pull_request run tests the MERGE COMMIT (branch + main) while the push run tests
# the branch tip alone, so the merge-commit check is no longer guaranteed on every
# push. It still runs whenever the pull_request run wins, `main` itself is fully
# checked on merge, and nothing here is a required status check (main carries no
# branch protection). Dropping the push trigger for branches instead would have
# been deterministic but worse: measured, ~35% of branch pushes happen with no PR
# open, and those would get no CI at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned by COMMIT SHA, not by tag (2026-07-27 ASVS scan,
# the GitHub-Actions High). A tag is mutable: whoever controls the upstream repo
# can repoint it at a new commit, and the next run fetches and executes it with NO
# diff visible here. Dependabot cannot catch that — it opens PRs on new RELEASES,
# not on a tag being moved — so "it is kept up to date" is not an answer.
#
# Pinning does NOT freeze these, and that is now MEASURED rather than claimed:
# within minutes of the v4 SHAs landing, Dependabot rebased its three open PRs onto
# them and re-proposed the majors as SHA-to-SHA diffs, version comment included.
# Those became the upgrade below. The trailing comment is the human-readable
# version; it is a comment, so only the SHA is load-bearing.
#
# Each SHA also carries a concrete release tag, which is consistent with a real
# release rather than a moved tag. Pinning freezes what is there now; it does not
# retroactively validate it.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The surface gate compares against the base, so it needs history rather
          # than the default single-commit checkout.
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.12.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm types:worker --check

      # ASVS scan L9: nothing was watching the advisory feed. Now something is.
      #
      # `--prod` because the tree that ships is the tree that matters: `sharp` (via
      # the vite plugin) and `brace-expansion` (via eslint) are build- and lint-time
      # only, and gating on them would spend the alarm on things that cannot reach a
      # user. `--audit-level high` for the same reason — a moderate that nobody will
      # act on this week trains people to ignore the step.
      #
      # DELIBERATELY NOT in `pnpm check`, unlike the four `verify:*` gates. Those are
      # offline and deterministic: the same tree gives the same answer forever. This
      # one asks an external service whose answer changes daily, so putting it in
      # `check` would make the DEPLOY gate depend on registry availability and make a
      # green check expire without the code changing. Here it runs on every PR and on
      # every push to a branch, which is where "somebody should look at this" belongs.
      #
      # A network failure and a real finding both exit non-zero here. That is
      # fail-closed on purpose, but it does mean a red step is worth reading before
      # assuming a new advisory.
      - name: dependency advisories (production tree, high and above)
        run: pnpm audit:deps
      # A change that touches a security surface must carry a record that the
      # surface was reviewed. This cannot judge whether the review was any good — it
      # makes SKIPPING one a deliberate act instead of a silent omission, which is
      # the failure it exists to prevent (a checklist that already contained the
      # missed item was simply never consulted).
      - name: security surfaces reviewed
        # The base ref goes through `env:` rather than being interpolated into the
        # script. These two values are commit SHAs and not attacker-controlled, but
        # the habit is what matters: an interpolated `${{ }}` inside `run:` is how
        # workflow injection happens, and a rule with an exception is a rule nobody
        # applies.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against; reporting surfaces without gating."
            node .github/scripts/security-surfaces.mjs --range "HEAD~1..HEAD" || true
          else
            node .github/scripts/security-surfaces.mjs --range "$BASE..HEAD" --require-review
          fi
