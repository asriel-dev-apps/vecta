name: Deploy

# Production is whatever `main` says it is. Merging to `main` deploys; nothing
# else does. That is the property the previous manual recipe could not offer —
# the live Worker was deployed from a feature branch, so "what is running?" was
# answerable only from someone's notes.
#
# `workflow_dispatch` is kept for re-running a deploy without a new commit (for
# example after rotating a secret, which does not change the code).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race. Not cancel-in-progress: a half-finished deploy that
# is cancelled would leave the verification step unrun.
concurrency:
  group: vecta-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure required reviewers on this GitHub Environment to gate deploys on
    # a human approval; leave it unprotected for deploy-on-merge.
    environment:
      name: production
      url: ${{ vars.VECTA_BASE_URL }}
    # NOTE: `CLOUDFLARE_API_TOKEN` is deliberately NOT here. A job-level `env:` is
    # materialised into EVERY step, so declaring the deploy credential at this
    # level handed it to the three third-party actions below — before any of this
    # repo's own code runs — and to `pnpm check`, which executes eslint, vitest,
    # vite, esbuild, workerd and every transitive dev dependency. Measured
    # 2026-07-29: NOTHING under `.github/scripts/` reads that variable; the only
    # consumer is `wrangler deploy`. So it now lives on that one step (ASVS scan,
    # the GitHub-Actions High).
    #
    # The `production` Environment gate does not help here: it authorises the job
    # to START and never inspects step contents, so approving a deploy approved
    # the exposure too.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # None of the following is a secret: an OIDC client id, issuer, endpoints
      # and redirect URI are all visible in the browser during sign-in, and the
      # MCP resource identifier is served unauthenticated at its metadata
      # document. They are environment *variables* so the tracked config can keep
      # its `.invalid` placeholders and nobody hand-edits a file to deploy. The
      # actual secrets (OIDC_CLIENT_SECRET, SESSION_SECRET, DATABASE_URL) are
      # Worker secrets, set once with `wrangler secret put`, and never travel
      # through CI.
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      VECTA_BASE_URL: ${{ vars.VECTA_BASE_URL }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
      OIDC_JWKS_URL: ${{ vars.OIDC_JWKS_URL }}
      OIDC_REDIRECT_URI: ${{ vars.OIDC_REDIRECT_URI }}
      OIDC_AUTH_ENDPOINT: ${{ vars.OIDC_AUTH_ENDPOINT }}
      OIDC_TOKEN_ENDPOINT: ${{ vars.OIDC_TOKEN_ENDPOINT }}
      MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
      PRE_AUTH_RATE_LIMIT_NAMESPACE_ID: ${{ vars.PRE_AUTH_RATE_LIMIT_NAMESPACE_ID }}
      AUTH_RATE_LIMIT_NAMESPACE_ID: ${{ vars.AUTH_RATE_LIMIT_NAMESPACE_ID }}
      COMPUTE_RATE_LIMIT_NAMESPACE_ID: ${{ vars.COMPUTE_RATE_LIMIT_NAMESPACE_ID }}
    steps:
      # Pinned by COMMIT SHA, not by tag — see the same note in `ci.yml`. It
      # matters more here: these three run inside the production Environment gate,
      # and used to start with the deploy credential already in their environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.12.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The gate is part of the deploy, not a separate workflow that happens to
      # be green: a deploy cannot outrun its own checks.
      - run: pnpm check
      - run: pnpm types:worker --check

      - name: Build the Worker
        run: pnpm --dir apps/web build

      # Writes the real configuration into the BUILT config (gitignored), never
      # into the tracked source. Also validates the deploy traps: the MCP
      # resource path, the redirect URI origin, distinct rate-limit namespaces,
      # a surviving `assets.directory`, and that no placeholder remains.
      - name: Materialize the deployment configuration
        run: node .github/scripts/materialize-deploy-config.mjs

      # `--name` is redundant (the materializer sets it) and passed anyway: with
      # neither, a deploy would land on the config's local development name and
      # the live site would silently stay on the previous version.
      - name: Deploy
        # The ONLY step that gets the deploy credential. `wrangler` reads it from
        # the environment; no script of ours references it.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --dir apps/web exec wrangler deploy
          -c build/server/wrangler.json
          --name "$WORKER_NAME"
          --tag "$GITHUB_SHA"

      # A version id proves the upload happened, not that users receive the new
      # bundle. This polls the live origin until the served asset graph matches
      # the build, then checks the two credential-free surfaces.
      - name: Verify the deployment
        run: node .github/scripts/verify-deployment.mjs
